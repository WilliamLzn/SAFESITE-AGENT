name: tests

on:
  push:
  pull_request:

jobs:
  nucleo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dependencias (solo lo que necesitan los tests)
        run: pip install numpy opencv-python-headless pytest
      - name: tests del nucleo
        run: python -m pytest tests -q
